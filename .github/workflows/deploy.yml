name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for backend image
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{date 'YYYYMMDD'}}-

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/backend.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Extract metadata for frontend image
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{date 'YYYYMMDD'}}-

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/frontend.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

    - name: Extract metadata for notification service image
      id: meta-notification
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/todo-notification
        tags: |
          type=ref,event=branch
          type=ref=event=pr
          type=sha,prefix={{date 'YYYYMMDD'}}-

    - name: Build and push notification service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/notification.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-notification.outputs.tags }}
        labels: ${{ steps.meta-notification.outputs.labels }}

    - name: Extract metadata for recurring task service image
      id: meta-recurring
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/todo-recurring-task
        tags: |
          type=ref,event=branch
          type=ref=event=pr
          type=sha,prefix={{date 'YYYYMMDD'}}-

    - name: Build and push recurring task service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/recurring-task.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta-recurring.outputs.tags }}
        labels: ${{ steps.meta-recurring.outputs.labels }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure kubectl for DigitalOcean
      run: |
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        kubectl cluster-info

    - name: Deploy to DigitalOcean Kubernetes using Helm
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        helm upgrade --install todo-app charts/todo-app \
          --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-backend \
          --set backend.image.tag=${{ github.sha }} \
          --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend \
          --set frontend.image.tag=${{ github.sha }} \
          --set notification.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-notification \
          --set notification.image.tag=${{ github.sha }} \
          --set recurringTask.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-recurring-task \
          --set recurringTask.image.tag=${{ github.sha }} \
          --set global.dbHost=${{ secrets.DB_HOST }} \
          --set global.dbPort=${{ secrets.DB_PORT }} \
          --set global.dbName=${{ secrets.DB_NAME }} \
          --set global.dbUser=${{ secrets.DB_USER }} \
          --set global.dbPassword=${{ secrets.DB_PASSWORD }} \
          --set global.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
          --wait --timeout=10m

    - name: Verify deployment
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig
        kubectl get pods
        kubectl get services
        kubectl rollout status deployment/backend-service --timeout=5m
        kubectl rollout status deployment/frontend-service --timeout=5m