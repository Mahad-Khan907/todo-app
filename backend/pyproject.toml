[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Todo Web App"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel==0.0.14",
    "sqlalchemy>=2.0.0,<2.1.0",
    "psycopg2-binary",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "bcrypt",
    "openai",
    "APScheduler",
]
