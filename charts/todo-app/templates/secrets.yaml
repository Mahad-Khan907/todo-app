apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.dbSecretName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.database.url | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.openaiSecretName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.openai.apiKey | b64enc | quote }}