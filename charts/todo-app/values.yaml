# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

image:
  backend:
    repository: todo-backend
    tag: v1
  frontend:
    repository: todo-frontend
    tag: v1
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  backendPort: 8000
  frontendPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Spec-driven secrets from Phase IV config
database:
  url: ""

openai:
  apiKey: ""