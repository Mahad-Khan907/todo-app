apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
  httpPipeline:
    handlers: []
  features:
  - name: serviceInvocation
    enabled: true
  - name: stateManagement
    enabled: true
  - name: pubsub
    enabled: true
  - name: bindings
    enabled: true
  - name: secretStores
    enabled: true