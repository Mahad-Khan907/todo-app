apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurring-task-service
  labels:
    app: recurring-task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurring-task-service
  template:
    metadata:
      labels:
        app: recurring-task-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurring-task-service"
        dapr.io/config: "dapr-config"
        dapr.io/components: "task-pubsub,task-statestore,app-secrets"
    spec:
      containers:
      - name: recurring-task-service
        image: recurring-task-service:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: database-url
        - name: DAPR_HTTP_ENDPOINT
          value: "http://localhost:3500"
        command: ["uvicorn", "recurring_task_service:app", "--host", "0.0.0.0", "--port", "8002"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: recurring-task-service
spec:
  selector:
    app: recurring-task-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP