# API Contract: Todo AI Chatbot
# This contract defines the expected API endpoints for the deployed application
# in the Kubernetes environment

openapi: 3.0.3
info:
  title: Todo AI Chatbot API
  description: API for the Todo AI Chatbot application deployed in Kubernetes
  version: 1.0.0
servers:
  - url: http://todo-frontend-service:3000
    description: Frontend service in Kubernetes cluster
  - url: http://todo-backend-service:8000
    description: Backend service in Kubernetes cluster

paths:
  /api/chat:
    post:
      summary: Send a message to the AI chatbot
      description: Sends a user message to the AI chatbot and receives a response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The user's message to the chatbot
                userId:
                  type: string
                  description: The ID of the authenticated user
              required:
                - message
                - userId
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The chatbot's response
                  conversationId:
                    type: string
                    description: ID of the conversation
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized - invalid or missing user ID
        '500':
          description: Internal server error

  /api/tasks:
    get:
      summary: Get user's tasks
      description: Retrieve all tasks for the authenticated user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            description: The ID of the authenticated user
      responses:
        '200':
          description: List of user's tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - invalid user ID
        '500':
          description: Internal server error
    post:
      summary: Create a new task
      description: Create a new task for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - invalid task data
        '401':
          description: Unauthorized - invalid user ID
        '500':
          description: Internal server error

  /api/tasks/{taskId}:
    get:
      summary: Get a specific task
      description: Retrieve a specific task by its ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
        '401':
          description: Unauthorized - invalid user ID
        '500':
          description: Internal server error
    put:
      summary: Update a task
      description: Update an existing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - invalid task data
        '404':
          description: Task not found
        '401':
          description: Unauthorized - invalid user ID
        '500':
          description: Internal server error
    delete:
      summary: Delete a task
      description: Delete a specific task by its ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
        '401':
          description: Unauthorized - invalid user ID
        '500':
          description: Internal server error

  /health:
    get:
      summary: Health check endpoint
      description: Check the health status of the service
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Service is unhealthy

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the task
        title:
          type: string
          description: Title of the task
        description:
          type: string
          description: Detailed description of the task
        completed:
          type: boolean
          description: Whether the task is completed
        userId:
          type: string
          description: ID of the user who owns the task
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
      required:
        - id
        - title
        - completed
        - userId
        - createdAt
        - updatedAt